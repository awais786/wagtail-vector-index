[tox]
min_version = 4.11

skipsdist = True

envlist =
    # Test stable Django 5.2/6.0 with stable Wagtail 6.0/7.1
    py{311,312,313}-django{5.2,6.0}-wagtail{6.0,7.1}-{sqlite,postgres}-{llm,base}
    # Test Django and Wagtail development branches
    py{312,313}-django{main}-wagtail{main}-{sqlite,postgres}-{llm,base}

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[gh-actions:env]
DB =
    sqlite: sqlite
    postgres: postgres
WAGTAIL =
    6.0: wagtail6.0
    7.1: wagtail7.1
    main: wagtailmain
DJANGO =
    5.1: django5.1
    5.2: django5.2
    6.0: django6.0
    main: djangomain

[testenv]
pass_env =
    FORCE_COLOR
    NO_COLOR
    OPENAI_API_KEY

set_env =
    PYTHONPATH = {toxinidir}
    PYTHONDEVMODE = 1
    postgres: DATABASE_URL={env:DATABASE_URL:postgres:///wagtail_vector_index}
    # Use your real API key by setting it in your environment, or it will default to 'test'
    OPENAI_API_KEY = {env:OPENAI_API_KEY:test}

deps =
    django5.2: Django>=5.2,<5.3
    django6.0: Django>=6.0,<7.0
    djangomain: git+https://github.com/django/django.git@main#egg=Django

    wagtail6.0: wagtail>=6.0,<7.0
    wagtail7.1: wagtail>=7.1,<8.0
    wagtailmain: git+https://github.com/wagtail/wagtail.git@main#egg=Wagtail

    postgres:
        psycopg2>=2.9
        -e .[pgvector]

    llm:
        -e .[llm]

    -e .[testing]

commands = python -Im coverage run -m pytest {posargs}

[testenv:coverage-report]
base_python = python3.11
; a bit of a hack - we want to keep deps to a minimum here
deps =
    coverage>=7.6,<8.0

commands =
    python -Im coverage combine
    python -Im coverage report -m

[testenv:wagtailmain]
description = Test with latest Wagtail main branch

deps =
    wagtailmain: git+https://github.com/wagtail/wagtail.git@main#egg=Wagtail

[testenv:interactive]
description = An interactive environment for local testing purposes
package = editable
basepython = python3.11

deps =
    wagtail>=5.2

    -e .[testing]

commands_pre =
    python {toxinidir}/testmanage.py makemigrations
    python {toxinidir}/testmanage.py migrate
    python {toxinidir}/testmanage.py shell -c "from django.contrib.auth.models import User;(not User.objects.filter(username='admin').exists()) and User.objects.create_superuser('admin', 'super@example.com', 'changeme')"
    python {toxinidir}/testmanage.py createcachetable

commands =
    {posargs:python testmanage.py runserver 0.0.0.0:8020}

setenv =
    INTERACTIVE = 1
    PYTHONPATH = {toxinidir}/tests:{toxinidir}
